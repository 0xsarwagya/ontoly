name: Publish NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v"
        required: false
      tag:
        description: "npm dist-tag to publish"
        required: true
        default: "rc"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm check-types
          pnpm test
          pnpm build
          pnpm validate:packages
          pnpm validate:pack
          pnpm validate:release-version

      # npm trusted publishing (OIDC): no token is stored or rotated. Each package trusts this workflow once:
      #   npm trust github <package> --file publish-npm.yml --repo 0xsarwagya/ontoly --env npm-publish
      # The npm CLI tries OIDC first and falls back to NPM_TOKEN, so the secret can be deleted once a
      # release has published over OIDC.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Check npm token (fallback only)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/ || echo "No usable NPM_TOKEN; publishing relies on trusted publishing (OIDC)."

      - name: Resolve npm dist-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "NPM_DIST_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          elif echo "$RELEASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=rc" >> "$GITHUB_ENV"
          fi

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_TAG: ${{ env.NPM_DIST_TAG }}
          NPM_PROVENANCE: "true"
        run: node scripts/publish-npm.mjs
